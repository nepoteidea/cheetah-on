name: Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Fork PRs don't get secrets, so they can't deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy to production
        if: github.event_name == 'push'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload PR preview
        id: preview
        if: github.event_name == 'pull_request'
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" \
            --message "PR #${{ github.event.number }} @ ${GITHUB_SHA::7}" | tee wrangler.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' wrangler.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request' && steps.preview.outputs.url
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.number }} --repo ${{ github.repository }} --edit-last --create-if-none \
            --body "🚀 Preview deployed: ${{ steps.preview.outputs.url }} (commit ${GITHUB_SHA::7})"
