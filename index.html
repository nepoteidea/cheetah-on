<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d4f33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Tilt your phone to roll a tiny chrome ball around a cheetah rug. Don't touch the cheetah or the pink border."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Cheetah On</title>
  </head>
  <body>
    <div id="stage" data-state="ready">
      <canvas
        id="game"
        aria-label="Playfield: a green rug with a pink border and a cheetah"
      ></canvas>
      <button id="exit-fullscreen" type="button" aria-label="Exit full screen" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path
            d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <p id="notice" role="status" hidden></p>
      <pre id="debug" hidden></pre>
      <div id="overlay">
        <div class="card">
          <h1 id="title">Cheetah On</h1>
          <p id="message">
            Tilt your phone to roll the ball. Don't touch the cheetah or the pink border.
          </p>
          <button id="play" type="button">Play</button>
          <p id="sensor-status" class="hint" role="status"></p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
